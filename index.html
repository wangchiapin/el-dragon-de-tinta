<title>墨龍飛天</title>
<style>
html{color-scheme:light}
:root{
  --paper:#f2ece0; --paper2:#e8e0d0; --ink:#1c1b19; --ink2:#5b5750; --ink3:#8d887e; --red:#b8362b;
  --serif:"Noto Serif TC","Songti TC","PMingLiU","Source Han Serif TC",serif;
  --kai:"Kaiti TC","BiauKai","DFKai-SB","KaiTi","Noto Serif TC",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--serif);overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;height:100dvh;touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
[hidden]{display:none!important}

/* 抬頭顯示 */
#hud{position:absolute;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) 14px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
#hud>*{pointer-events:none}
#scoreBox .num{font-size:30px;line-height:1;font-weight:700;letter-spacing:1px}
#scoreBox small{display:block;font-size:11px;color:var(--ink2);margin-top:3px}
#themeChip{position:absolute;left:50%;transform:translateX(-50%);top:calc(58px + env(safe-area-inset-top));text-align:center;background:rgba(242,236,224,.9);border:1px solid var(--ink3);border-radius:999px;padding:4px 16px;font-size:14px;white-space:nowrap;max-width:60vw}
#themeChip small{display:block;font-size:10px;color:var(--ink2)}
#rightBox{display:flex;align-items:center;gap:8px}
#hearts{position:absolute;right:16px;top:calc(62px + env(safe-area-inset-top));font-size:20px;line-height:1;color:var(--red);letter-spacing:3px}
#hearts .off{color:var(--ink3);opacity:.55}
.hb{pointer-events:auto!important;width:38px;height:38px;border-radius:50%;border:1px solid var(--ink3);background:rgba(242,236,224,.85);font:inherit;font-size:17px;line-height:1;color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
#gear{font-size:19px}
.gearSvg{width:25px;height:25px;display:block}
#menu .card{position:relative}
#menuGear{position:absolute;top:12px;right:12px}
#pauseBtn{font-size:13px;letter-spacing:-1px}
#musicBtn.off{opacity:.4;text-decoration:line-through}
#toast{position:absolute;left:50%;top:24%;transform:translateX(-50%);font-size:26px;letter-spacing:4px;text-align:center;pointer-events:none;opacity:0;transition:opacity .3s}
#toast small{display:block;font-size:12px;letter-spacing:1px;color:var(--ink2);margin-top:4px}
#toast.on{opacity:1}
#egg{position:absolute;left:50%;top:36%;transform:translateX(-50%);width:90%;text-align:center;pointer-events:none;opacity:0;transition:opacity .8s;font-family:"Kaiti TC","BiauKai","DFKai-SB","KaiTi","Noto Serif TC",serif;color:var(--ink)}
#egg.on{opacity:.92}
#egg .z{font-size:44px;letter-spacing:8px;text-shadow:0 0 14px rgba(242,236,224,.9)}
#egg .p{font-size:15px;letter-spacing:1px;margin-top:6px;color:var(--ink2)}
#egg .t{font-size:13px;margin-top:3px;color:var(--ink2);font-style:italic}

/* 畫面（選單、結果、設定） */
.screen{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;padding:18px;overflow-y:auto}
.screen>.card{margin:auto 0}
.card{width:100%;max-width:380px;background:rgba(242,236,224,.88);border:1px solid var(--ink3);border-radius:18px;padding:26px 22px 22px;text-align:center;box-shadow:0 8px 30px rgba(28,27,25,.12)}
h1{margin:0;font-family:var(--kai);font-size:46px;letter-spacing:8px;font-weight:700;line-height:1.1}
h1 small{display:block;font-family:var(--serif);font-size:13px;letter-spacing:2px;color:var(--ink2);font-weight:400;margin-top:6px}
#pauseScr .card>div:first-child small{display:block;font-family:var(--serif);font-size:13px;letter-spacing:2px;color:var(--ink2);margin-top:4px}
.sub{font-size:14px;line-height:1.7;margin:14px 0 4px;color:var(--ink)}
.sub small{display:block;font-size:11.5px;line-height:1.55;color:var(--ink2);margin-top:3px}
.lbl{font-size:14px;margin:16px 0 8px}
.lbl small{display:block;font-size:11px;color:var(--ink2)}
.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;max-width:300px;height:54px;margin:12px auto 0;border-radius:999px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);font:inherit;font-size:18px;letter-spacing:3px;cursor:pointer;line-height:1.15}
.btn small{font-size:10.5px;letter-spacing:0;opacity:.8}
a.btn{text-decoration:none}
.btn[hidden]{display:none}
.btn.ghost{background:transparent;color:var(--ink)}
.opt{display:flex;flex-direction:column;align-items:center;justify-content:center;height:46px;padding:0 14px;border-radius:999px;border:1px solid var(--ink3);background:transparent;color:var(--ink);font:inherit;font-size:15px;cursor:pointer;line-height:1.1}
.opt small{font-size:10px;color:var(--ink2)}
.opt.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.opt.on small{color:var(--paper);opacity:.8}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.themes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.themes .opt{padding:0 4px}
.zh{display:block}
.namebox{width:100%;max-width:300px;height:44px;border-radius:999px;border:1px solid var(--ink3);background:rgba(255,255,255,.4);text-align:center;font:inherit;font-size:15px;color:var(--ink);margin:0 auto;display:block}
.note{font-size:12px;line-height:1.5;color:var(--ink2);margin-top:10px}
.note small{display:block;font-size:11px;margin-top:2px}
.namebox.need{border-color:var(--red)}
.ver{margin-top:14px;font-size:10px;color:var(--ink3)}
.copy{margin-top:4px;font-size:10px;line-height:1.4;color:var(--ink3);user-select:none;font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif}
#res .big{font-size:56px;font-weight:700;line-height:1.1;margin:10px 0 2px}
#res .stat{font-size:13px;color:var(--ink2);margin-top:6px}
#res .cmt{font-size:18px;margin:12px 0 2px;font-family:var(--kai)}
#res .cmt small{display:block;font-size:12px;color:var(--ink2);font-family:var(--serif)}
#res .rec{color:var(--red);font-size:15px;margin-top:8px;letter-spacing:2px}
#lbBox{margin-top:12px;font-size:13px;text-align:left}
#lbBox .lbT{font-size:15px;text-align:center}
#lbBox .lbT small{display:block;font-size:11px;color:var(--ink2)}
#lbBox ol{list-style:none;margin:6px 0 0;padding:0}
#lbBox li{display:flex;gap:8px;padding:3px 6px;border-bottom:1px solid var(--ink3)}
#lbBox li .n{width:22px;color:var(--ink3)}
#lbBox li .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lbBox li .sc{font-weight:700}
#lbBox li.me{color:var(--red)}
#lbBox .lbM{text-align:center;color:var(--ink2);font-size:12px;margin-top:6px}
#revBox{margin-top:14px;text-align:left}
#revBox .rvT{font-size:15px;text-align:center}
#revBox .rvT small{display:block;font-size:11px;color:var(--ink2)}
#revList{max-height:34vh;overflow-y:auto;border-top:1px solid rgba(141,136,126,.5)}
.rv{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid rgba(141,136,126,.35)}
.rv .w{min-width:74px;font-family:var(--kai);font-size:22px;font-weight:700;line-height:1.1}
.rv .m{flex:1;font-size:12.5px;line-height:1.35;color:var(--ink)}
.rv .m small{display:block;font-size:11px;color:var(--ink2)}
.rv .tag{flex:none;font-size:11px;border-radius:999px;padding:2px 9px;border:1px solid var(--ink3);color:var(--ink2);white-space:nowrap}
.rv .tag.w2{border-color:var(--red);color:var(--red)}
#revNone{text-align:center;font-size:14px;margin-top:6px}
.dlgBg{background:rgba(28,27,25,.35)}
.setrow{margin-top:14px;text-align:center}
.setrow .l{font-size:13px;margin-bottom:6px}
.setrow .l small{color:var(--ink2);font-size:10.5px;margin-left:4px}
.setrow .opt{height:40px;font-size:14px}
</style>

<script>
/* ===== 一鍵靜音（關掉音樂和音效）— 每天一分鐘遊戲統一做法 ===== */
(function(){
  var KEY='hg.mute.dragon', MOUNT='', muted=false, masters=[];
  try{ muted = localStorage.getItem(KEY)==='1'; }catch(e){}
  /* 讓這個遊戲建立的所有 Web Audio 聲音，都先經過一個總音量；靜音＝總音量 0 */
  try{
    var BP = window.BaseAudioContext ? window.BaseAudioContext.prototype : (window.AudioContext||window.webkitAudioContext).prototype;
    var desc = Object.getOwnPropertyDescriptor(BP,'destination');
    if(desc && desc.get){
      Object.defineProperty(BP,'destination',{configurable:true,get:function(){
        var real = desc.get.call(this);
        if(!this.__hgMaster){
          try{ var g=this.createGain(); g.gain.value = muted?0:1; g.connect(real); this.__hgMaster=g; masters.push(g); }
          catch(e){ return real; }
        }
        return this.__hgMaster;
      }});
    }
  }catch(e){}
  /* 備用的 <audio> 播放（例如 iPhone 的 Chrome）也一起靜音 */
  try{
    var op = HTMLMediaElement.prototype.play;
    HTMLMediaElement.prototype.play = function(){ this.muted = muted; return op.apply(this, arguments); };
  }catch(e){}
  function apply(){ masters.forEach(function(g){ try{ g.gain.setValueAtTime(muted?0:1, g.context.currentTime); }catch(e){ g.gain.value = muted?0:1; } }); }
  function build(){
    if(document.getElementById('hgMute')) return;
    var st=document.createElement('style');
    st.textContent='#hgMute{position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:2147483000;width:40px;height:40px;border-radius:50%;border:1px solid rgba(0,0,0,.28);background:rgba(255,255,255,.88);color:#222;font-size:19px;line-height:1;padding:0;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.25);touch-action:manipulation;-webkit-tap-highlight-color:transparent}#hgMute:active{transform:scale(.94)}#hgMute.st{position:static;flex:0 0 40px;margin:0 0 0 8px}';
    document.head.appendChild(st);
    var b=document.createElement('button'); b.type='button'; b.id='hgMute';
    function paint(){ b.textContent = muted?'🔇':'🔊'; b.setAttribute('aria-pressed', muted?'true':'false');
      b.title = b.ariaLabel = muted ? '開啟音樂和音效 · Activar música y efectos' : '靜音（音樂和音效）· Silenciar música y efectos'; apply(); }
    b.addEventListener('click',function(e){ e.stopPropagation(); muted=!muted; try{ localStorage.setItem(KEY, muted?'1':'0'); }catch(err){} paint(); });
    b.addEventListener('pointerdown',function(e){ e.stopPropagation(); });
    paint();
    var anchor = MOUNT && document.querySelector(MOUNT);
    if(anchor && anchor.parentNode){ b.className='st'; anchor.parentNode.insertBefore(b, anchor.nextSibling); } else document.body.appendChild(b);
  }
  if(document.body) build(); else document.addEventListener('DOMContentLoaded', build);
})();

(function(){
'use strict';

/* =====================================================================
   一、共用設定（和 跑吧／色數／比比看 同一把 localStorage 鑰匙）
   ===================================================================== */
const SETTINGS_KEY = 'hanziGames.settings';
const SET_OPTS = { script:['trad','simp'], lang:['es','en','zh'], phon:['pinyin','zhuyin','both','off'] };
function readSettings(){
  const out = { v:1, script:'trad', lang:'es', phon:'pinyin' };
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || 'null'); }catch(e){}
  if(saved && typeof saved === 'object'){
    Object.keys(SET_OPTS).forEach(k=>{ if(SET_OPTS[k].includes(saved[k])) out[k] = saved[k]; });
  }
  return out;
}
function writeSettings(o){
  try{
    let cur = {};
    try{ cur = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}') || {}; }catch(e){}
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(Object.assign(cur, { v:1, script:o.script, lang:o.lang, phon:o.phon })));   // 不動共用設定裡的語速（跑吧等其他遊戲還在用）
  }catch(e){}
}

function pair(key){
  const e = I18N[key]; if(!e) return ['',''];
  const zh = S.script === 'simp' ? e[1] : e[0];
  const sm = S.lang === 'zh' ? '' : (S.lang === 'en' ? e[3] : e[2]);
  return [zh, sm];
}
// 雙行：上面中文，下面小字西文或英文；「只有中文」就只有一行
function fill(el, key){
  const [zh, sm] = pair(key);
  el.innerHTML = '<span class="zh">'+zh+'</span>' + (sm ? '<small>'+sm+'</small>' : '');
}

/* 拼音（帶聲調符號）→ 注音（和 跑吧 同一份轉換器） */
const ZY = (function(){
  var INI = {b:'ㄅ',p:'ㄆ',m:'ㄇ',f:'ㄈ',d:'ㄉ',t:'ㄊ',n:'ㄋ',l:'ㄌ',g:'ㄍ',k:'ㄎ',h:'ㄏ',j:'ㄐ',q:'ㄑ',x:'ㄒ',zh:'ㄓ',ch:'ㄔ',sh:'ㄕ',r:'ㄖ',z:'ㄗ',c:'ㄘ',s:'ㄙ'};
  var FIN = {a:'ㄚ',o:'ㄛ',e:'ㄜ',ê:'ㄝ',ai:'ㄞ',ei:'ㄟ',ao:'ㄠ',ou:'ㄡ',an:'ㄢ',en:'ㄣ',ang:'ㄤ',eng:'ㄥ',er:'ㄦ',
    i:'ㄧ',ia:'ㄧㄚ',io:'ㄧㄛ',ie:'ㄧㄝ',iao:'ㄧㄠ',iu:'ㄧㄡ',iou:'ㄧㄡ',ian:'ㄧㄢ',in:'ㄧㄣ',iang:'ㄧㄤ',ing:'ㄧㄥ',
    u:'ㄨ',ua:'ㄨㄚ',uo:'ㄨㄛ',uai:'ㄨㄞ',ui:'ㄨㄟ',uei:'ㄨㄟ',uan:'ㄨㄢ',un:'ㄨㄣ',uen:'ㄨㄣ',uang:'ㄨㄤ',ong:'ㄨㄥ',ueng:'ㄨㄥ',
    v:'ㄩ',ve:'ㄩㄝ',van:'ㄩㄢ',vn:'ㄩㄣ',iong:'ㄩㄥ'};
  var MARK = ['','','ˊ','ˇ','ˋ'];
  function one(syl){
    var s = syl.normalize('NFD'), tone = 5;
    if(/̄/.test(s)) tone = 1; else if(/́/.test(s)) tone = 2; else if(/̌/.test(s)) tone = 3; else if(/̀/.test(s)) tone = 4;
    s = s.replace(/ü/g,'v').replace(/Ü/g,'v').replace(/[̀-ͯ]/g,'').replace(/ü/g,'v').toLowerCase();
    if(!/^[a-zê]+$/.test(s)) return syl;
    var ini = '', rest = s, m;
    if(s === 'n' || s === 'm'){ var zz = s === 'n' ? 'ㄣ' : 'ㄇㄨ'; return tone === 5 ? '˙' + zz : zz + MARK[tone]; }
    if(s === 'er' || s === 'r'){ rest = 'er'; }
    else if((m = s.match(/^(zh|ch|sh|[bpmfdtnlgkhjqxrzcs])/))){ ini = m[1]; rest = s.slice(ini.length); }
    else if(s[0] === 'y'){
      rest = s.slice(1);
      if(/^u/.test(rest)) rest = rest.replace(/^u/, 'v');
      else if(rest === 'i' || rest === 'in' || rest === 'ing') rest = rest;
      else rest = 'i' + rest;
    } else if(s[0] === 'w'){
      rest = s.slice(1);
      rest = (rest === 'u') ? 'u' : 'u' + rest;
    }
    if(ini && /^[jqx]$/.test(ini)) rest = rest.replace(/^u/, 'v');
    if(/^(zh|ch|sh|r|z|c|s)$/.test(ini) && rest === 'i') rest = '';
    var f = rest === '' ? '' : FIN[rest];
    if(f === undefined) return syl;
    var z = (ini ? INI[ini] : '') + f;
    return tone === 5 ? '˙' + z : z + MARK[tone];
  }
  function conv(py){ return String(py||'').trim().split(/\s+/).filter(Boolean).map(one).join(' '); }
  // 「mǐfàn」這種連在一起的拼音，先拆成音節
  function split(py){
    var out = [], cur = '';
    var VOW = /[aeiouüāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ]/i;
    for(var i=0;i<py.length;i++){
      cur += py[i];
      var next = py[i+1];
      if(next === undefined){ out.push(cur); cur=''; break; }
      if(VOW.test(py[i]) && !VOW.test(next)){
        // 母音後面接子音：看那個子音是要留在這個音節（n、ng、r），還是開下一個音節
        var rest = py.slice(i+1);
        var keep = 0;
        if(/^ng(?![aeiouüāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ])/i.test(rest)) keep = 2;
        else if(/^n(?![aeiouüāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ])/i.test(rest)) keep = 1;
        else if(/^r(?![aeiouüāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ])/i.test(rest)) keep = 1;
        if(keep){ cur += rest.slice(0,keep); i += keep; }
        out.push(cur); cur = '';
      } else if(VOW.test(py[i]) && VOW.test(next)){
        // 兩個母音相連：ai ei ao ou ia ie iao iu ua uo ui 等，留在同一音節
        continue;
      }
    }
    if(cur) out.push(cur);
    return out;
  }
  function convWord(py){ return String(py||'').split(/[\s'’]+/).filter(Boolean).map(function(p){ return split(p).map(one).join(' '); }).join(' '); }
  return { one: one, conv: conv, word: convWord };
})();

async function nickHash(nick){
  const norm = String(nick).normalize('NFKC').trim().toLowerCase().replace(/\s+/g, ' ');
  try{
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(norm));
    return Array.from(new Uint8Array(buf)).slice(0, 8).map(b => b.toString(16).padStart(2, '0')).join('');
  }catch(e){
    let h1 = 0x811c9dc5, h2 = 0x01000193;
    for(const ch of norm){ const c = ch.codePointAt(0); h1 = Math.imul(h1 ^ c, 16777619) >>> 0; h2 = Math.imul(h2 + c, 2246822519) >>> 0; }
    return h1.toString(16).padStart(8, '0') + h2.toString(16).padStart(8, '0');
  }
}

// 練習範圍：內建主題 id 清單＋老師自訂主題（每位老師最多 3 個、每個最多 40 詞，至少 6 詞）
function applySet(d){
  const allow = new Set((Array.isArray(d.builtin) ? d.builtin : []).filter(id => KNOWN.has(id)));
  (Array.isArray(d.custom) ? d.custom : []).slice(0, CUSTOM_MAX).forEach(c=>{
    if(!c || !/^[a-z0-9]{1,32}$/.test(String(c.id||'')) || KNOWN.has(c.id)) return;
    const words = (Array.isArray(c.words) ? c.words : []).slice(0, CUSTOM_WORDS_MAX).map(w=>{
      if(typeof w === 'string') w = w.split('\t');   // 資料庫每詞存成一個字串（五欄用 Tab 隔開）
      if(!Array.isArray(w) || typeof w[0] !== 'string' || !w[0].trim()) return null;
      const t = w[0].trim().slice(0, 8);
      return [t, String(w[1]||t).trim().slice(0, 8), String(w[2]||'').trim().slice(0, 60), String(w[3]||'').trim().slice(0, 60), String(w[4]||'').trim().slice(0, 60)];
    }).filter(Boolean);
    if(words.length < 6) return;
    const nm = String(c.name||'').trim().slice(0, 12) || '自訂';
    THEMES.push({ id: c.id, name: [nm, nm, nm, nm], words, custom: true });
    allow.add(c.id);
  });
  if(!allow.size) throw { code: 'not-found' };
  ALLOWED = allow;
}
async function submitClassScore(entry){
  const app = await getCentral(), cdb = app.firestore();
  const h = await nickHash(entry.name);
  const ref = cdb.collection('class_scores').doc(CLASS_ID + '_dragon_' + entry.theme + '_' + h);
  const ts = firebase.firestore.FieldValue.serverTimestamp();
  const extra = { c: entry.correct, a: entry.altitude, wr: entry.wr };
  const old = await ref.get();
  if(!old.exists){
    await ref.set({ cid: CLASS_ID, owner: classData.owner, game: 'dragon', k: entry.theme, h, nick: entry.name, best: entry.score, plays: 1, lastAt: ts, extra });
  }else{
    const o = old.data(), upd = { nick: entry.name, plays: (o.plays || 0) + 1, lastAt: ts, best: Math.max(o.best || 0, entry.score) };
    if(entry.score > (o.best || 0)) upd.extra = extra;
    await ref.update(upd);
  }
}

/* =====================================================================
   五、字的產生
   ===================================================================== */
function curTheme(){ return THEMES[themeIdx]; }
function wText(w){ return S.script === 'simp' ? w[1] : w[0]; }
function wRead(w){
  if(S.phon === 'off') return '';
  const py = w[2], zy = ZY.word(py);
  return S.phon === 'pinyin' ? py : S.phon === 'zhuyin' ? zy : py + '  ' + zy;
}
function wTrans(w){ return S.lang === 'es' ? w[3] : S.lang === 'en' ? w[4] : ''; }
function fontSizeFor(text){ const n = [...text].length; return n <= 1 ? 30 : n === 2 ? 26 : n === 3 ? 22 : 18; }
function measureItem(it){
  it.text = wText(it.w);
  it.fs = fontSizeFor(it.text);
  ctx.font = '700 '+it.fs+'px '+FONT_WORD;
  const tw = ctx.measureText(it.text).width;
  it.r = Math.max(30, tw/2 + 15);
  it.read = wRead(it.w);
  it.trans = wTrans(it.w);
}
function refillBags(){
  const th = curTheme();
  if(!bagGood.length) bagGood = shuffle(th.words.slice());
  if(!bagBad.length){
    const skip = NO_MIX[th.id] || [];
    const others = []; THEMES.forEach((t,i)=>{ if(i!==themeIdx && skip.indexOf(t.id)<0) others.push(...t.words); });
    const goodSet = new Set(th.words.map(w=>w[0]));
    bagBad = shuffle(others.filter(w=>!goodSet.has(w[0])));
  }
  if(!bagSim.length){
    const sim = []; (SIMILAR[th.id]||[]).forEach(id=>{ if((NO_MIX[th.id]||[]).indexOf(id)>=0) return; const t = THEMES.find(x=>x.id===id); if(t) sim.push(...t.words); });
    bagSim = shuffle(sim);
  }
}
// 等級越高，越常出現「相近主題」的干擾字（第 2 級開始，最多 55%）
function simChance(){ return level < 2 ? 0 : Math.min(0.55, (level-1)*0.14); }
function pickWord(good){
  refillBags();
  let bag = good ? bagGood : bagBad;
  if(!good && bagSim.length && Math.random() < simChance()) bag = bagSim;
  // 盡量不要和畫面上已經有的字重複
  for(let k=0;k<bag.length;k++){
    const w = bag[bag.length-1-k];
    if(!items.some(it=>it.w===w)){ bag.splice(bag.length-1-k,1); return w; }
  }
  return bag.pop();
}
function anyGoodOnScreen(){ return items.some(it=>it.good && !it.gone && it.y < H*0.95); }

function newItem(good){
  const w = pickWord(good);
  const it = { w, good, x:0, y:0, blob:Array.from({length:14},()=>rnd(.9,1.1)), rot:rnd(0,6.28), ph:rnd(0,6.28), gone:false };
  measureItem(it);
  return it;
}
function placeItem(it){
  const m = it.r + 8;
  for(let tries=0; tries<14; tries++){
    const x = rnd(m, W-m);
    const y = -it.r - 30;
    let ok = true;
    for(const o of items){
      if(o.gone) continue;
      if(Math.abs(o.y - y) < o.r + it.r + 60 && Math.abs(o.x - x) < o.r + it.r + 24){ ok = false; break; }
    }
    if(ok){ it.x = x; it.bx = x; it.y = y; return true; }
  }
  return false;
}
function spawnLucky(){
  const it = { w:LUCKY[Math.floor(rnd(0,LUCKY.length))], good:false, lucky:true, x:0, y:0, blob:Array.from({length:14},()=>rnd(.9,1.1)), rot:rnd(0,6.28), ph:rnd(0,6.28), gone:false };
  measureItem(it); it.read = ''; it.trans = '';
  if(placeItem(it)) items.push(it);
}
function spawnRow(){
  if(score >= 300 && goldCd <= 0 && Math.random() < 0.12){ goldCd = 40; spawnLucky(); }
  let n = Math.random() < 0.55 ? 1 : 2;
  if(level >= 3 && Math.random() < 0.3) n = 3;
  for(let k=0;k<n;k++){
    const needGood = !anyGoodOnScreen();
    const good = needGood ? true : Math.random() < 0.42;
    const it = newItem(good);
    if(placeItem(it)) items.push(it);
    else { (good ? bagGood : bagBad).push(it.w); }  // 放不下：把字放回袋子
  }
}

let AC = null, musicBus = null, sfxBus = null, reverb = null, noiseBuf = null;

// 建立音訊路線：音樂和音效各一條，都送一點到「殘響」，聽起來像在山谷裡
function buildAudio(){
  const rate = AC.sampleRate, len = Math.floor(rate*1.8);
  const ir = AC.createBuffer(2, len, rate);
  for(let ch=0; ch<2; ch++){
    const d = ir.getChannelData(ch);
    for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/len, 2.6);
  }
  reverb = AC.createConvolver(); reverb.buffer = ir;
  const wet = AC.createGain(); wet.gain.value = 0.3; reverb.connect(wet); wet.connect(AC.destination);
  musicBus = AC.createGain(); musicBus.gain.value = 1; musicBus.connect(AC.destination); musicBus.connect(reverb);
  sfxBus = AC.createGain(); sfxBus.gain.value = 1; sfxBus.connect(AC.destination);
  const sfxSend = AC.createGain(); sfxSend.gain.value = 0.55; sfxBus.connect(sfxSend); sfxSend.connect(reverb);
  noiseBuf = AC.createBuffer(1, Math.floor(rate*0.25), rate);
  const nd = noiseBuf.getChannelData(0); for(let i=0;i<nd.length;i++) nd[i] = Math.random()*2-1;
}
function ensureAudio(){
  try{
    if(!AC){ const C = window.AudioContext || window.webkitAudioContext; if(C){ AC = new C(); buildAudio(); } }
    if(AC && AC.state === 'suspended') AC.resume();
    startMusicLoop();
  }catch(e){}
}

/* ---- 樂器（全部用振盪器合成，不用音檔）---- */
// 古箏：撥弦的「嗒」＋ 很快變暗的音
function zheng(freq, t, vol, dest, dur){
  dur = dur || 1.5;
  const o = AC.createOscillator(), o2 = AC.createOscillator(), h2 = AC.createGain();
  const f = AC.createBiquadFilter(), g = AC.createGain();
  o.type = 'triangle'; o.frequency.setValueAtTime(freq*1.012, t); o.frequency.exponentialRampToValueAtTime(freq, t+0.05);
  o2.type = 'sine'; o2.frequency.setValueAtTime(freq*2.003, t); h2.gain.value = 0.32;
  f.type = 'lowpass'; f.Q.value = 0.8;
  f.frequency.setValueAtTime(Math.min(9000, freq*9), t);
  f.frequency.exponentialRampToValueAtTime(Math.max(600, freq*1.7), t+dur*0.65);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+0.006); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(f); o2.connect(h2); h2.connect(f); f.connect(g); g.connect(dest);
  o.start(t); o2.start(t); o.stop(t+dur+0.05); o2.stop(t+dur+0.05);
  // 指甲撥弦的小聲「嗒」
  const ns = AC.createBufferSource(), bp = AC.createBiquadFilter(), ng = AC.createGain();
  ns.buffer = noiseBuf; bp.type = 'bandpass'; bp.frequency.value = Math.min(5000, freq*4); bp.Q.value = 1.1;
  ng.gain.setValueAtTime(vol*0.7, t); ng.gain.exponentialRampToValueAtTime(0.0001, t+0.035);
  ns.connect(bp); bp.connect(ng); ng.connect(dest); ns.start(t); ns.stop(t+0.06);
}
// 二胡：拉出來的長音，帶一點滑音和顫音
function erhu(freq, t, dur, vol, dest){
  const o = AC.createOscillator(), lp = AC.createBiquadFilter(), g = AC.createGain();
  const lfo = AC.createOscillator(), lg = AC.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(freq*0.972, t); o.frequency.exponentialRampToValueAtTime(freq, t+0.1);
  lp.type = 'lowpass'; lp.Q.value = 1.4; lp.frequency.setValueAtTime(900, t); lp.frequency.linearRampToValueAtTime(2200, t+0.4);
  lfo.type = 'sine'; lfo.frequency.value = 5.4;
  lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(16, t+0.45);      // 顫音慢慢出來（單位：音分）
  lfo.connect(lg); lg.connect(o.detune);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t+0.2);
  g.gain.setValueAtTime(vol, t+Math.max(0.25, dur-0.35)); g.gain.linearRampToValueAtTime(0.0001, t+dur);
  o.connect(lp); lp.connect(g); g.connect(dest);
  o.start(t); lfo.start(t); o.stop(t+dur+0.05); lfo.stop(t+dur+0.05);
}
// 木魚：短短的「叩」
function wood(t, vol, freq, dest){
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(freq*1.15, t); o.frequency.exponentialRampToValueAtTime(freq, t+0.02);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t+0.09);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t+0.12);
  const ns = AC.createBufferSource(), bp = AC.createBiquadFilter(), ng = AC.createGain();
  ns.buffer = noiseBuf; bp.type = 'bandpass'; bp.frequency.value = freq*2; bp.Q.value = 2;
  ng.gain.setValueAtTime(vol*0.5, t); ng.gain.exponentialRampToValueAtTime(0.0001, t+0.02);
  ns.connect(bp); bp.connect(ng); ng.connect(dest); ns.start(t); ns.stop(t+0.04);
}
// 鼓：低低的「咚」
function drum(t, vol, dest){
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(52, t+0.16);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t+0.32);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t+0.36);
}
// 鑼：幾個不整齊的泛音一起慢慢散掉
function gong(t, vol, base, dest, dur){
  dur = dur || 2.2;
  [[1,1],[1.52,0.7],[2.13,0.5],[2.76,0.35],[3.41,0.22]].forEach(([m,a],i)=>{
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine'; o.frequency.value = base*m;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol*a, t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur*(1-i*0.1));
    o.connect(g); g.connect(dest); o.start(t); o.stop(t+dur+0.05);
  });
}

/* ---- 音效 ---- */
const nf = n => 293.66*Math.pow(2, n/12);               // 以 D4 為 0 的半音數 → 頻率
function playAt(fn){ if(!AC || !sfxBus) return; try{ fn(AC.currentTime+0.01); }catch(e){} }
function sfxGood(){ playAt(t=>{ [12,19,24].forEach((n,i)=> zheng(nf(n), t+i*0.055, 0.12-i*0.015, sfxBus, 1.1)); }); }   // 古箏往上刷
function sfxBad(){ playAt(t=>{ wood(t, 0.16, 520, sfxBus); wood(t+0.09, 0.13, 410, sfxBus); gong(t+0.02, 0.07, 110, sfxBus, 1.1); }); }   // 木魚加低沉的鑼
function sfxUp(){ playAt(t=>{ [7,9,12,14,16,19,21,24].forEach((n,i)=> zheng(nf(n), t+i*0.07, 0.09, sfxBus, 1.0)); }); }          // 一串往上的古箏
function sfxEgg(){ playAt(t=>{ [19,24,28,31,36].forEach((n,i)=> zheng(nf(n), t+i*0.09, 0.09, sfxBus, 1.3)); }); }   // 高高的一串古箏
function sfxRoar(){ playAt(t=>{ gong(t, 0.1, 73, sfxBus, 3.2); erhu(nf(-12), t+0.05, 2.4, 0.04, sfxBus); erhu(nf(-5), t+0.7, 1.8, 0.03, sfxBus); }); }   // 低沉的鑼和二胡
function sfxEnd(){ playAt(t=>{ [19,14,9,4,0].forEach((n,i)=> zheng(nf(n), t+i*0.24, 0.1, sfxBus, 1.6)); gong(t+0.1, 0.08, 98, sfxBus, 2.6); erhu(nf(-5), t+0.2, 1.8, 0.03, sfxBus); }); }

/* ---- 背景音樂：D 五聲音階（D E F# A B）的固定旋律 ----
   4 個樂句（每句 4 小節、32 個八分音符），排成 8 句一輪循環。
   數字是「離 D4 幾個半音」，null 是休息。 */
const PHR = {
  A:[ 9,null,7,null, 4,null,7,9,   12,null,9,7, 9,null,null,null,   7,null,9,null, 12,null,14,12,   9,null,7,4, 2,null,0,null ],
  B:[ 14,null,12,9, 12,null,14,16,   19,null,16,14, 12,null,null,9,   14,null,16,19, 21,null,19,16,   14,12,9,7, 9,null,null,null ],
  C:[ 12,null,9,null, 7,null,9,12,   9,null,7,4, 2,null,4,7,   9,null,7,null, 4,null,2,0,   2,null,4,null, 0,null,null,null ],
  D:[ 7,7,9,null, 12,null,9,7,   4,null,7,9, 12,null,null,null,   14,14,12,null, 9,null,12,14,   16,null,14,12, 9,null,null,null ],
};
// 二胡長音：[第幾步開始, 音, 拉幾步]
const ERHU = {
  A:[[0,4,14],[16,2,14]], B:[[0,9,14],[16,7,14]], C:[[0,4,14],[16,0,14]], D:[[0,7,14],[16,9,14]],
};
const SONG = ['A','A','B','C','A','B','D','C'];
const BASS = [-12,-17,-12,-10];
let mStep = 0, mNext = 0, mTimer = 0;
function stepDur(){ return 60/(84 + Math.min(level,10)*4)/2; }     // 八分音符的長度；越飛越高，速度越快
function scheduleStep(i, t){
  const ph = SONG[Math.floor(i/32) % SONG.length], k = i % 32, bar = Math.floor(k/8), st = k % 8;
  const mel = PHR[ph][k];
  if(mel !== null) zheng(nf(mel), t, st === 0 ? 0.085 : 0.068, musicBus, 1.5);
  ERHU[ph].forEach(([s,n,len])=>{ if(s === k) erhu(nf(n), t, len*stepDur(), 0.024, musicBus); });
  if(st === 0){ zheng(nf(BASS[bar]), t, 0.07, musicBus, 2.4); drum(t, 0.09, musicBus); }
  if(st === 4) drum(t, 0.05, musicBus);
  if(st === 2 || st === 6) wood(t, 0.035, st === 2 ? 1000 : 760, musicBus);
  if(level >= 3 && st % 2 === 1) wood(t, 0.015, 1350, musicBus);        // 高等級多一點節奏
  if(i % (32*SONG.length) === 0) gong(t, 0.05, 150, musicBus, 3);       // 每一輪開頭敲一下鑼
}
function musicTick(){
  if(!AC || !musicBus) return;
  // 只在遊戲進行中、沒暫停、音樂開著的時候出聲
  if(!(musicOn && state === 'play' && !paused)){ mNext = 0; return; }
  const now = AC.currentTime;
  if(mNext < now + 0.05) mNext = now + 0.08;                           // 暫停回來、或被瀏覽器拖慢之後，從現在接著放
  while(mNext < now + 0.4){ scheduleStep(mStep, mNext); mNext += stepDur(); mStep++; }
}
function startMusicLoop(){ if(!mTimer) mTimer = setInterval(musicTick, 100); }
function restartMusic(){ mStep = 0; mNext = 0; }
function setMusic(on){
  musicOn = on;
  try{ localStorage.setItem('dragonInk.music', on ? '1' : '0'); }catch(e){}
  $('musicBtn').classList.toggle('off', !on);
  markGroup('gMusic', on ? 'on' : 'off');
}

let eggDone = new Set(), goldT = 0, goldCd = 0, petalT = 0, petals = [], roarT = 0, cloudT = 0, idiomN = 0, eggTimer = 0, BODY = '28,27,25';

function updateEggs(dt){

  for(let i=petals.length-1;i>=0;i--){ const p = petals[i]; p.y += p.vy*dt; p.x += Math.sin(time*1.3+p.ph)*30*dt; p.rot += p.vr*dt; if(p.y > H+20) petals.splice(i,1); }

function drawEggsBack(){
  // 雲海：淡淡的雲層慢慢飄，遠山從上面滑下去
  if(cloudT > 0){
    const el = CLOUD_LEN - cloudT, env = Math.min(1, el/2, cloudT/2), p = el/CLOUD_LEN;
    ctx.save();
    for(let k=0;k<3;k++){
      const bx = W*(0.2+0.3*k) + Math.sin(k*2.1)*W*0.1, by = -H*0.12 + p*H*1.35 + k*H*0.06, w = W*(0.28+0.06*k), h = H*(0.2+0.04*k);
      ctx.fillStyle = 'rgba(28,27,25,'+(0.12*env)+')';
      ctx.beginPath(); ctx.moveTo(bx-w, by); ctx.quadraticCurveTo(bx-w*0.3, by-h*0.55, bx-w*0.08, by-h); ctx.quadraticCurveTo(bx+w*0.2, by-h*0.5, bx+w*0.4, by-h*0.7); ctx.quadraticCurveTo(bx+w*0.7, by-h*0.2, bx+w, by); ctx.closePath(); ctx.fill();
    }
    for(let i=0;i<6;i++){
      const y = ((i*H/5 + scroll*0.4*(1+i*0.15)) % (H+240)) - 120, x = W/2 + Math.sin(time*0.25+i*1.9)*W*0.3;
      ctx.save(); ctx.translate(x,y); ctx.scale(1,0.32);
      const g = ctx.createRadialGradient(0,0,0,0,0,W*0.75); g.addColorStop(0,'rgba(250,246,238,'+(0.7*env)+')'); g.addColorStop(1,'rgba(250,246,238,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0,0,W*0.75,0,6.283); ctx.fill(); ctx.restore();
    }
    ctx.restore();
  }
  // 龍吟：畫面浮出一個大大的墨字「龍」
  if(roarT > 0){
    const el = ROAR_LEN - roarT, a = Math.sin(Math.min(1, el/ROAR_LEN)*Math.PI);
    ctx.save(); ctx.globalAlpha = 0.2*a; ctx.fillStyle = '#1c1b19';
    ctx.font = '700 '+Math.min(W*0.95,H*0.6)+'px '+FONT_WORD; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(S.script === 'simp' ? '龙' : '龍', W/2, H*0.46); ctx.restore();

}
function drawEggsFront(){

    ctx.beginPath(); ctx.ellipse(0,0,p.sz,p.sz*0.6,0,0,6.283); ctx.fill(); ctx.restore();

function startGame(){
  ensureAudio(); restartMusic(); $('pauseScr').hidden = true;
  score=0; hearts=MAX_HEARTS; combo=0; correct=0; wrongCount=0; level=0; scroll=0; spawnAcc=0; time=0;
  resetEggs(); speed = 130; items=[]; parts=[]; floats=[]; shake=0; mouthT=0; hurtT=0; bagGood=[]; bagBad=[]; bagSim=[]; wrongMap = new Map(); missMap = new Map();
  initDragon();
  state = 'play'; paused = false;
  $('menu').hidden = true; $('res').hidden = true; $('hud').hidden = false;
  renderHud(); renderThemeChip();
  try{ window.HGPlays && HGPlays.start(curTheme().id, ($('nameInp').value||'').trim()); }catch(e){}
  lastT = performance.now();
}
function levelSpeed(){ return Math.min(330, 130 + level*16); }
function gapDist(){ return Math.max(95, 135 - level*5); }

function eat(it){
  it.gone = true;
  const r = it.r;
  if(it.lucky){
    score += 100; mouthT = 0.3;
    for(let k=0;k<22;k++){ const a = rnd(0,6.28), v = rnd(60,260); parts.push({ x:it.x, y:it.y, vx:Math.cos(a)*v, vy:Math.sin(a)*v-30, r:rnd(2,5), life:rnd(0.6,1.1), max:1.1, gold:true }); }
    floats.push({ x:it.x, y:it.y-r, txt:'+100 '+(S.script==='simp'?'金':'金'), life:1.2, max:1.2, red:false });
    sfxEgg();
    renderHud(); checkEggs();
    return;
  }
  if(it.good){
    correct++; combo++;
    const mult = 1 + Math.floor(combo/5);
    const pts = 10*mult;
    score += pts;
    mouthT = 0.25;
    inkSplash(it.x, it.y, 14, 1, false);
    floats.push({ x:it.x, y:it.y-r, txt:'+'+pts, life:0.9, max:0.9, red:false });
    sfxGood();
    if(correct % 8 === 0){ level++; speed = levelSpeed(); showToast('up'); sfxUp(); }
    renderHud(); checkEggs();
  } else {
    hearts--; combo = 0; wrongCount++;
    wrongMap.set(it.w, (wrongMap.get(it.w)||0) + 1);
    shake = 0.35; hurtT = 0.5;
    inkSplash(it.x, it.y, 26, 1.6, true);
    sfxBad();
    try{ navigator.vibrate && navigator.vibrate(60); }catch(e){}
    renderHud();
    if(hearts <= 0) endGame();
  }
}
function inkSplash(x,y,n,k,red){

    const a = rnd(0,6.28), v = rnd(40,260)*k;
    parts.push({ x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v - 30, r:rnd(2,7)*k*0.8, life:rnd(0.5,1.0), max:1.0, red: red && Math.random()<0.25 });
  }
}
function endGame(){
  state = 'over';

  const alt = Math.floor(scroll/12);

  try{ best = parseInt(localStorage.getItem(key)||'0',10) || 0; }catch(e){}

  setTimeout(()=>{
    $('hud').hidden = true;
    $('res').hidden = false;

    const [eZh] = pair('eaten'), [aZh] = pair('alt'), [bZh] = pair('best');
    $('resStat').textContent = eZh+' '+correct+'　·　'+aZh+' '+alt+' m　·　'+bZh+' '+best;
    $('resRec').hidden = !rec; $('resRec').innerHTML = rec ? pair('newRec')[0] : '';
    const ck = correct<=0?'c0':correct<10?'c1':correct<25?'c2':correct<50?'c3':'c4';
    fill($('resCmt'), ck);
    $('lbBox').hidden = !(pubBoard() || CLASS_MODE);
    renderReview();
  }, 600);
  const wr = [...wrongMap.keys(), ...[...missMap.keys()].filter(w=>!wrongMap.has(w))].slice(0,5).map(w=>w[0]);
  const entry = { name: ($('nameInp').value||'').trim() || '玩家', theme: curTheme().id, score, correct, altitude: alt, ts: Date.now(), wr };
  if(CLASS_MODE && classData){ classFinish(entry); }
  else if(pubBoard()){
    const th = entry.theme;
    (async () => {
      try{ if(score>0) await LEADERBOARD.submit(entry); }catch(e){ console.warn(e); }
      try{ await renderBoard(th); }catch(e){}

function renderReview(){
  const rows = [];
  wrongMap.forEach((n,w)=>rows.push({ w, n, wrong:true }));
  missMap.forEach((n,w)=>{ if(!wrongMap.has(w)) rows.push({ w, n, wrong:false }); });
  // 吃錯的排前面，次數多的優先
  rows.sort((a,b)=> (b.wrong - a.wrong) || (b.n - a.n));
  const box = $('revBox'), list = $('revList');
  list.innerHTML = '';
  fill($('revT'), 'revTitle');
  if(!rows.length){
    box.hidden = correct === 0 && wrongCount === 0;      // 一個字都沒玩到就不顯示
    list.hidden = true;
    $('revNone').hidden = false; fill($('revNone'), 'revNone');
    return;
  }
  box.hidden = false; list.hidden = false; $('revNone').hidden = true;
  rows.slice(0, 20).forEach(r=>{

    div.querySelector('.w').textContent = text;

/* =====================================================================
   九、更新
   ===================================================================== */
const held = { l:false, r:false, u:false, d:false };
function update(dt){
  time += dt;
  updateEggs(dt);
  const playing = state === 'play';
  const spd = playing ? speed : 55;
  scroll += spd*dt;

  if(playing){
    let dx = (held.r?1:0)-(held.l?1:0), dy = (held.d?1:0)-(held.u?1:0);
    if(dx||dy){ const L = Math.hypot(dx,dy); dragon.tx += dx/L*430*dt; dragon.ty += dy/L*300*dt; clampTarget(); }
  } else {
    dragon.tx = W/2 + Math.sin(time*0.7)*W*0.18; dragon.ty = H*0.78 + Math.sin(time*1.1)*10;
  }
  const px = dragon.x, py = dragon.y;
  dragon.x += (dragon.tx-dragon.x)*Math.min(1,dt*12);
  dragon.y += (dragon.ty-dragon.y)*Math.min(1,dt*12);
  dragon.vx = (dragon.x-px)/Math.max(dt,0.001);
  dragon.vy = (dragon.y-py)/Math.max(dt,0.001);
  // 頭轉向：朝著移動的方向，可以一路轉到朝下（往回飛）；停下來就慢慢轉回朝上
  const mv = Math.hypot(dragon.vx, dragon.vy);
  if(mv > 60) dragon.turning = true; else if(mv < 22) dragon.turning = false;   // 前後門檻不同，避免在邊界一直抖
  const want = dragon.turning ? Math.atan2(dragon.vx, -dragon.vy) : 0;          // 0＝朝上，正＝往右，±π＝朝下
  let diff = want - dragon.ang;
  diff = Math.atan2(Math.sin(diff), Math.cos(diff));                            // 走最短的角度
  dragon.ang += diff*Math.min(1,dt*9);
  dragon.ang = Math.atan2(Math.sin(dragon.ang), Math.cos(dragon.ang));
  const relax = clamp(1 - mv/140, 0, 1);      // 越靜止越接近 1：身體才會垂回頭的下方

  // 龍身：後一節跟著前一節
  const P = dragon.pts;
  P[0].x = dragon.x; P[0].y = dragon.y;
  for(let i=1;i<P.length;i++){
    const a = P[i-1], b = P[i];
    b.y += ((a.y+SEG_GAP)-b.y)*Math.min(1,dt*4*relax);       // 移動時身體跟著頭走過的路線；靜止時才垂下來
    b.x += (a.x-b.x)*Math.min(1,dt*(1.5+7.5*relax));
    const dx = a.x-b.x, dy = a.y-b.y, d = Math.hypot(dx,dy) || 1;
    if(d > SEG_GAP){ b.x = a.x - dx/d*SEG_GAP; b.y = a.y - dy/d*SEG_GAP; }
  }

  // 左右相連：頭飛出一邊，整條龍（含目標點）移到另一邊
  if(playing){
    let sh = 0;
    if(dragon.x < 0) sh = W; else if(dragon.x > W) sh = -W;
    if(sh){ dragon.x += sh; dragon.tx += sh; for(const p of P) p.x += sh; }
  } else {
    dragon.x = clamp(dragon.x, 0, W);
  }

  if(mouthT>0) mouthT -= dt;
  if(hurtT>0) hurtT -= dt;
  if(shake>0) shake -= dt;

  if(playing){
    spawnAcc += spd*dt;
    if(spawnAcc >= gapDist()){ spawnAcc = 0; spawnRow(); }
    // 嘴巴的位置跟著頭的方向走
    const hx = dragon.x + Math.sin(dragon.ang)*12, hy = dragon.y - Math.cos(dragon.ang)*12;
    for(let i=items.length-1;i>=0;i--){
      const it = items[i];
      if(it.gone){ items.splice(i,1); continue; }
      it.y += spd*dt;
      it.x = it.bx + Math.sin(time*1.6 + it.ph)*7;
      let ddx = it.x-hx; if(ddx > W/2) ddx -= W; else if(ddx < -W/2) ddx += W;
      if(Math.hypot(ddx, it.y-hy) < it.r*0.78 + 20){
        eat(it);
        if(state !== 'play') break;
        continue;
      }
      if(it.y > H + it.r + 50){
        if(it.good) missMap.set(it.w, (missMap.get(it.w)||0) + 1);   // 對的字沒吃到
        items.splice(i,1);
      }
    }
  } else {
    items.length = 0;
  }
  for(let i=parts.length-1;i>=0;i--){
    const p = parts[i];
    p.life -= dt; if(p.life<=0){ parts.splice(i,1); continue; }
    p.vy += 260*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= (1-dt*1.5);
  }
  for(let i=floats.length-1;i>=0;i--){
    const f = floats[i]; f.life -= dt; f.y -= 40*dt;
    if(f.life<=0) floats.splice(i,1);
  }
}

/* =====================================================================
   十、畫水墨
   ===================================================================== */
// 宣紙紋路：事先畫一小塊，鋪滿全畫面
const paperTile = (function(){
  const c = document.createElement('canvas'); c.width = c.height = 160;
  const g = c.getContext('2d');
  g.fillStyle = '#f2ece0'; g.fillRect(0,0,160,160);
  for(let i=0;i<900;i++){
    g.fillStyle = 'rgba('+(120+Math.random()*60|0)+','+(110+Math.random()*50|0)+','+(90+Math.random()*40|0)+','+(Math.random()*0.07)+')';
    g.fillRect(Math.random()*160, Math.random()*160, Math.random()*2.2+0.4, Math.random()*0.8+0.3);
  }
  for(let i=0;i<14;i++){
    g.strokeStyle = 'rgba(160,145,120,'+(Math.random()*0.07)+')'; g.lineWidth = 0.6;
    g.beginPath(); const y = Math.random()*160; g.moveTo(0,y); g.lineTo(160, y+Math.random()*6-3); g.stroke();
  }
  return c;
})();
let paperPat = null;

function nz(x, seed){ return (Math.sin(x+seed) + 0.55*Math.sin(x*2.3+seed*1.7) + 0.28*Math.sin(x*5.1+seed*0.6) + 1.83) / 3.66; }
const LAYERS = [
  { par:0.18, a:0.10, w:0.14, amp:0.10, f:0.0045, seedL:1.0, seedR:7.3 },
  { par:0.38, a:0.17, w:0.10, amp:0.11, f:0.0060, seedL:3.1, seedR:11.9 },
  { par:0.70, a:0.30, w:0.05, amp:0.10, f:0.0085, seedL:5.7, seedR:2.2 },
];
function drawCliffs(){
  for(const L of LAYERS){
    const sc = scroll*L.par;
    for(const side of [0,1]){
      const seed = side ? L.seedR : L.seedL;
      const maxW = W*(L.w+L.amp);
      ctx.beginPath();
      ctx.moveTo(side ? W : 0, -12);
      for(let y=-12; y<=H+12; y+=10){
        const wy = y - sc;
        const e = W*(L.w + L.amp*nz(wy*L.f, seed));
        ctx.lineTo(side ? W-e : e, y);
      }
      ctx.lineTo(side ? W : 0, H+12);
      ctx.closePath();
      const g = ctx.createLinearGradient(side ? W : 0, 0, side ? W-maxW : maxW, 0);
      g.addColorStop(0, 'rgba(28,27,25,'+L.a*1.5+')');
      g.addColorStop(0.55, 'rgba(28,27,25,'+L.a+')');
      g.addColorStop(1, 'rgba(28,27,25,'+(L.a*0.35)+')');
      ctx.fillStyle = g; ctx.fill();
    }
  }
}
function drawMist(){
  for(let i=0;i<6;i++){
    const span = H + 240;
    const y = ((i*span/6 + scroll*(0.42 + (i%3)*0.12)) % span) - 120;
    const w = W*(0.9 + (i%3)*0.25), h = 70 + (i%3)*26;
    const x = W*(0.2 + ((i*0.37)%0.7)) + Math.sin(time*0.2 + i)*20;
    ctx.save(); ctx.translate(x,y); ctx.scale(1, h/w);
    const g = ctx.createRadialGradient(0,0,0,0,0,w/2);
    g.addColorStop(0,'rgba(242,236,224,0.62)'); g.addColorStop(1,'rgba(242,236,224,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0,0,w/2,0,6.283); ctx.fill(); ctx.restore();
  }
}
function drawBackground(){
  if(!paperPat) paperPat = ctx.createPattern(paperTile,'repeat');
  ctx.fillStyle = '#f2ece0'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = paperPat; ctx.fillRect(0,0,W,H);
  // 朱紅的太陽：整幅畫唯一的顏色
  const sr = Math.min(W,H)*0.085, sx = W*0.7, sy = H*0.15 + Math.sin(scroll*0.002)*4;
  const sg = ctx.createRadialGradient(sx,sy,sr*0.2,sx,sy,sr*1.25);
  sg.addColorStop(0,'rgba(184,54,43,0.82)'); sg.addColorStop(0.78,'rgba(184,54,43,0.78)'); sg.addColorStop(1,'rgba(184,54,43,0)');
  ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(sx,sy,sr*1.25,0,6.283); ctx.fill();
  drawCliffs();
  drawMist();
  // 上下漸暈，像水墨畫的邊
  const tg = ctx.createLinearGradient(0,0,0,H*0.18);
  tg.addColorStop(0,'rgba(242,236,224,0.55)'); tg.addColorStop(1,'rgba(242,236,224,0)');
  ctx.fillStyle = tg; ctx.fillRect(0,0,W,H*0.18);
}

function blobPath(x,y,r,radii,rot){
  const n = radii.length, P = [];
  for(let i=0;i<n;i++){ const a = rot + i/n*6.2832; P.push([x+Math.cos(a)*r*radii[i], y+Math.sin(a)*r*radii[i]]); }
  const mid = (a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];
  ctx.beginPath();
  const m0 = mid(P[n-1],P[0]); ctx.moveTo(m0[0],m0[1]);
  for(let i=0;i<n;i++){ const p = P[i], m = mid(P[i],P[(i+1)%n]); ctx.quadraticCurveTo(p[0],p[1],m[0],m[1]); }
  ctx.closePath();
}
function drawItems(){
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for(const it of items){
    ctx.globalAlpha = clamp((it.y - 70)/70, 0, 1);
    if(ctx.globalAlpha <= 0) continue;
    // 淡淡的暈
    blobPath(it.x, it.y, it.r*1.22, it.blob, it.rot+0.4);
    ctx.fillStyle = 'rgba(28,27,25,0.10)'; ctx.fill();
    blobPath(it.x, it.y, it.r, it.blob, it.rot);
    ctx.fillStyle = it.lucky ? 'rgba(176,128,28,0.95)' : 'rgba(28,27,25,0.93)'; ctx.fill();
    ctx.font = '700 '+it.fs+'px '+FONT_WORD;
    ctx.fillStyle = '#f2ece0';
    ctx.fillText(it.text, it.x, it.y+1);
    let yy = it.y + it.r + 14;
    if(it.read){ ctx.font = '600 13px '+FONT_UI; ctx.fillStyle = '#3a3733'; ctx.fillText(it.read, it.x, yy); yy += 15; }
    if(it.trans){ ctx.font = '11px '+FONT_UI; ctx.fillStyle = '#6a665d'; ctx.fillText(it.trans, it.x, yy); }
  }
  ctx.globalAlpha = 1;
}
function drawParts(){
  for(const p of parts){
    const a = clamp(p.life/p.max,0,1);
    ctx.fillStyle = p.gold ? 'rgba(200,150,40,'+(0.9*a)+')' : p.red ? 'rgba(184,54,43,'+(0.8*a)+')' : 'rgba(28,27,25,'+(0.85*a)+')';
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r*(0.5+0.5*a),0,6.283); ctx.fill();
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for(const f of floats){
    const a = clamp(f.life/f.max,0,1);
    ctx.font = '700 22px '+FONT_UI; ctx.fillStyle = 'rgba(28,27,25,'+a+')';
    ctx.fillText(f.txt, f.x, f.y);
  }
}

function drawDragon(){
  const P = dragon.pts, N = P.length;
  const wig = P.map((p,i)=> Math.sin(time*4.2 - i*0.5) * 5 * Math.min(1, i/6));
  // 雲（龍飛過的水氣）
  ctx.save();
  ctx.globalAlpha = 0.5;
  for(let i=3;i<N;i+=4){
    const g = ctx.createRadialGradient(P[i].x+wig[i],P[i].y,0,P[i].x+wig[i],P[i].y,34);
    g.addColorStop(0,'rgba(242,236,224,0.7)'); g.addColorStop(1,'rgba(242,236,224,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(P[i].x+wig[i],P[i].y,34,0,6.283); ctx.fill();
  }
  ctx.restore();
  // 背鰭
  for(let i=2;i<N-3;i+=2){
    const p = P[i], q = P[i-1];
    const dx = p.x+wig[i]-(q.x+wig[i-1]), dy = p.y-q.y, d = Math.hypot(dx,dy)||1;
    const nx = -dy/d, ny = dx/d, k = i/N, h = lerp(11,3,k);
    ctx.fillStyle = 'rgba('+BODY+','+lerp(0.85,0.4,k)+')';
    ctx.beginPath();
    ctx.moveTo(p.x+wig[i]+nx*6*(1-k)-dx/d*3, p.y+ny*6*(1-k)-dy/d*3);
    ctx.lineTo(p.x+wig[i]+nx*(6*(1-k)+h)+dx/d*4, p.y+ny*(6*(1-k)+h)+dy/d*4);
    ctx.lineTo(p.x+wig[i]+nx*6*(1-k)+dx/d*6, p.y+ny*6*(1-k)+dy/d*6);
    ctx.fill();
  }
  // 身體：像毛筆一筆一筆畫出來，越往尾巴越細越淡
  ctx.lineCap = 'round';
  for(let i=N-1;i>=1;i--){
    const k = i/N, w = lerp(19,2.2,Math.pow(k,0.85));
    ctx.strokeStyle = 'rgba('+BODY+','+lerp(0.96,0.5,k)+')';
    ctx.lineWidth = w;
    ctx.beginPath(); ctx.moveTo(P[i-1].x+wig[i-1],P[i-1].y); ctx.lineTo(P[i].x+wig[i],P[i].y); ctx.stroke();
  }
  // 腹部留白：飛白的筆觸
  for(let i=N-2;i>=2;i--){
    const k = i/N;
    ctx.strokeStyle = 'rgba(242,236,224,'+lerp(0.28,0.1,k)+')';
    ctx.lineWidth = lerp(6,1,k);
    ctx.beginPath(); ctx.moveTo(P[i-1].x+wig[i-1]-2,P[i-1].y); ctx.lineTo(P[i].x+wig[i]-2,P[i].y); ctx.stroke();
  }
  // 尾巴的小毛
  const tl = P[N-1], tx = tl.x+wig[N-1];
  ctx.strokeStyle = 'rgba('+BODY+',0.5)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(tx,tl.y); ctx.quadraticCurveTo(tx+9*Math.sin(time*3),tl.y+10,tx+4,tl.y+22); ctx.stroke();

  // 頭：長長的吻、分岔的鹿角、飄動的長鬚（龍頭朝上，身體在下面）
  const tilt = dragon.ang;
  ctx.save();
  ctx.translate(dragon.x, dragon.y); ctx.rotate(tilt);
  const hurt = hurtT > 0 && Math.floor(hurtT*20)%2 === 0;
  const ink = hurt ? 'rgba(184,54,43,0.95)' : 'rgba('+BODY+',0.97)';
  const sw = Math.sin(time*3.5);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  // 鬃毛（朱紅一點點，從後腦往下飄）
  ctx.strokeStyle = 'rgba(184,54,43,0.78)'; ctx.lineWidth = 2.2;
  for(let sd=-1;sd<=1;sd+=2){
    for(let j=0;j<4;j++){
      ctx.beginPath(); ctx.moveTo(sd*9,4+j*4);
      ctx.bezierCurveTo(sd*(22+j*4),10+j*5+Math.sin(time*5+j)*3, sd*(28+j*5),26+j*6, sd*(23+j*3),40+j*7+Math.sin(time*4+j*2)*4);
      ctx.stroke();
    }
  }
  // 鹿角：向後彎，帶兩個分岔
  ctx.strokeStyle = ink; ctx.lineWidth = 3.6;
  for(let sd=-1;sd<=1;sd+=2){
    ctx.beginPath(); ctx.moveTo(sd*7,-8); ctx.quadraticCurveTo(sd*22,-12,sd*28,6); ctx.stroke();
    ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.moveTo(sd*18,-11); ctx.quadraticCurveTo(sd*24,-22,sd*33,-24); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sd*25,-3); ctx.quadraticCurveTo(sd*34,-8,sd*40,-3); ctx.stroke();
    ctx.lineWidth = 3.6;
  }
  // 後腦與脖子
  ctx.fillStyle = ink;
  ctx.beginPath(); ctx.ellipse(0,4,15,17,0,0,6.283); ctx.fill();
  // 長吻：從眉心一路伸到鼻頭，前端微微上翹
  ctx.beginPath();
  ctx.moveTo(-13,-6);
  ctx.bezierCurveTo(-15,-24,-12,-36,-8,-42);
  ctx.quadraticCurveTo(0,-49,8,-42);
  ctx.bezierCurveTo(12,-36,15,-24,13,-6);
  ctx.closePath(); ctx.fill();
  // 鼻頭，和吻上留白的飛白筆觸
  ctx.beginPath(); ctx.ellipse(0,-44,9,5.5,0,0,6.283); ctx.fill();
  ctx.strokeStyle = 'rgba(242,236,224,0.22)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-7,-12); ctx.quadraticCurveTo(-9,-28,-6,-40);
  ctx.moveTo(7,-12); ctx.quadraticCurveTo(9,-28,6,-40); ctx.stroke();
  // 嘴線；吃到字時嘴巴張開
  if(mouthT > 0){
    ctx.fillStyle = '#f2ece0'; ctx.beginPath(); ctx.ellipse(0,-37,7.5,9,0,0,6.283); ctx.fill();
    ctx.fillStyle = 'rgba(184,54,43,0.88)'; ctx.beginPath(); ctx.ellipse(0,-34,4.2,4.6,0,0,6.283); ctx.fill();
    ctx.fillStyle = '#f2ece0';
    ctx.beginPath(); ctx.moveTo(-4,-44); ctx.lineTo(-2.5,-40); ctx.lineTo(-1,-44); ctx.fill();
    ctx.beginPath(); ctx.moveTo(4,-44); ctx.lineTo(2.5,-40); ctx.lineTo(1,-44); ctx.fill();
  } else {
    ctx.strokeStyle = 'rgba(242,236,224,0.4)'; ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.moveTo(0,-30); ctx.lineTo(0,-43); ctx.stroke();
  }
  // 眉骨（讓眼神有點兇）和眼睛
  ctx.strokeStyle = ink; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(-15,-12); ctx.lineTo(-5,-19); ctx.moveTo(15,-12); ctx.lineTo(5,-19); ctx.stroke();
  ctx.fillStyle = '#f2ece0';
  ctx.beginPath(); ctx.ellipse(-8.5,-11,4.8,3,0.5,0,6.283); ctx.ellipse(8.5,-11,4.8,3,-0.5,0,6.283); ctx.fill();
  ctx.fillStyle = hurt ? '#1c1b19' : 'rgba(184,54,43,0.95)';
  ctx.beginPath(); ctx.arc(-8.5,-11,2.2,0,6.283); ctx.arc(8.5,-11,2.2,0,6.283); ctx.fill();
  // 長鬚：從嘴邊往兩側飄，再往後捲
  ctx.strokeStyle = 'rgba('+BODY+',0.82)';
  for(let sd=-1;sd<=1;sd+=2){
    ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.moveTo(sd*9,-37);
    ctx.bezierCurveTo(sd*(26+sw*4),-40, sd*(48+sw*6),-12, sd*(36+sw*8),30+sw*4);
    ctx.stroke();
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(sd*8,-32);
    ctx.bezierCurveTo(sd*(20-sw*3),-30, sd*(34-sw*5),-4, sd*(26-sw*5),26);
    ctx.stroke();
  }
  // 下巴的小鬍子
  ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(0,-30); ctx.quadraticCurveTo(sw*4,-20,sw*6,-12); ctx.stroke();
  ctx.restore();
}

function render(){
  ctx.save();
  if(shake>0){ const m = shake*18; ctx.translate(rnd(-m,m), rnd(-m,m)); }
  drawBackground();
  drawEggsBack();
  drawItems();
  {
    let minX = 1e9, maxX = -1e9;
    for(const p of dragon.pts){ if(p.x<minX) minX=p.x; if(p.x>maxX) maxX=p.x; }
    for(const off of [-W,0,W]){
      if(maxX+off < -70 || minX+off > W+70) continue;
      ctx.save(); ctx.translate(off,0); drawDragon(); ctx.restore();
    }
  }
  drawParts();
  drawEggsFront();
  ctx.restore();
}

function keyDir(e, v){
  switch(e.key){
    case 'ArrowLeft': case 'a': case 'A': held.l = v; break;
    case 'ArrowRight': case 'd': case 'D': held.r = v; break;
    case 'ArrowUp': case 'w': case 'W': held.u = v; break;
    case 'ArrowDown': case 's': case 'S': held.d = v; break;
    default: return false;
  }
  return true;
}
window.addEventListener('keydown', e=>{
  if(e.target && e.target.tagName === 'INPUT') return;
  if(keyDir(e,true)) e.preventDefault();
  if(e.key === 'Escape' && state === 'play'){
    if(!$('dlg').hidden) closeSettings();
    else if(!$('pauseScr').hidden) resumeGame();
    else pauseGame();
  }
});

// 給自動測試用（唯讀的狀態，不影響遊戲）
window.__dragon = {
  // 自動測試用：用離線音訊把音樂或音效「錄」下來，回傳音量統計（不會出聲）
  async renderTest(kind, secs, wav){
    const saved = { AC, musicBus, sfxBus, reverb, noiseBuf };
    try{
      const oc = new OfflineAudioContext(2, Math.floor(44100*secs), 44100);
      AC = oc; buildAudio();
      if(kind === 'music'){ let t = 0.05, i = 0; while(t < secs-1.5){ scheduleStep(i, t); t += stepDur(); i++; } }
      else if(kind === 'good') sfxGood(); else if(kind === 'bad') sfxBad(); else if(kind === 'up') sfxUp(); else if(kind === 'end') sfxEnd();
      const buf = await oc.startRendering(), d = buf.getChannelData(0);
      let peak = 0, nan = 0, clip = 0, sum = 0; const rms = []; let acc = 0, cnt = 0;
      for(let i=0;i<d.length;i++){
        const v = d[i]; if(v !== v){ nan++; continue; }
        const a = Math.abs(v); if(a > peak) peak = a; if(a >= 0.99) clip++; sum += v; acc += v*v; cnt++;
        if(cnt === 44100){ rms.push(+Math.sqrt(acc/cnt).toFixed(4)); acc = 0; cnt = 0; }
      }
      const out = { peak:+peak.toFixed(3), nan, clip, dc:+(sum/d.length).toFixed(5), rms };
      if(wav){   // 要試聽用：把聲音回傳成 16 位元 PCM（base64）
        const L = buf.getChannelData(0), R = buf.getChannelData(1), pcm = new Int16Array(L.length*2);
        for(let i=0;i<L.length;i++){ pcm[2*i] = Math.max(-1,Math.min(1,L[i]))*32767; pcm[2*i+1] = Math.max(-1,Math.min(1,R[i]))*32767; }
        let bin = ''; const u8 = new Uint8Array(pcm.buffer);
        for(let i=0;i<u8.length;i+=0x8000) bin += String.fromCharCode.apply(null, u8.subarray(i, i+0x8000));
        out.pcm = btoa(bin);
      }
      return out;
    } finally { AC = saved.AC; musicBus = saved.musicBus; sfxBus = saved.sfxBus; reverb = saved.reverb; noiseBuf = saved.noiseBuf; }
  },
  get musicStep(){ return mStep; },
  get review(){ return { wrong:[...wrongMap.keys()].map(w=>w[0]), miss:[...missMap.keys()].map(w=>w[0]) }; },
  get state(){ return { state, paused, score, hearts, combo, correct, level, speed, W, H, items: items.map(i=>({text:i.text,good:i.good,x:i.x,y:i.y,r:i.r})), dragon:{x:dragon.x,y:dragon.y,ang:dragon.ang,tail:{x:dragon.pts[10].x,y:dragon.pts[10].y}} }; },
  setScore(n){ score = n; checkEggs(); },
  endNow(){ if(state==='play') endGame(); },
  eggs(){ return { done:[...eggDone], goldT, petals:petals.length, roarT, cloudT, idiomN, lucky:items.filter(i=>i.lucky).length }; },
  moveTo(x,y){ dragon.tx = x; dragon.ty = y; clampTarget(); },
  settings: S,
};
})();

<script>
/* ===== 遊玩紀錄（hgPlays）— 每個遊戲共用，貼在 </body> 前 =====
   用法：
     HGPlays.visit();                       // 頁面打開時（本檔會自動呼叫一次）
     HGPlays.start('easy', '小明');         // 真的開始玩一局（關卡／難度、暱稱都可省略）
     HGPlays.end({score: 120, name: '小明'}); // 這一局正常結算（score、name 可省略）
   沒呼叫 end 的那一局，後台就會顯示「沒玩完」。
   寫到 memorma 專案：plays（每局）、visits（每台裝置每天每遊戲一筆）。
   任何錯誤都靜默，不影響遊戲。 */
(function () {
  var GAME = 'dragon';          // ← 每個遊戲改成自己的代號（英文小寫、底線）
  var NAME_GETTER = null;                // ← 可選：function(){ return 目前暱稱或'' }
  var CFG = { apiKey: 'AIzaSyC_YSDn2OH6_GKKwCq0d8QFNl3fYXzTC60', authDomain: 'memorma-24dab.firebaseapp.com',
              projectId: 'memorma-24dab', appId: '1:806709458465:web:f0d12acb2f911f2f165560' };
  var V = '10.12.2', CDN = 'https://www.gstatic.com/firebasejs/' + V + '/';
  var cur = null, readyP = null, lib = null;

  function gid() { try { return (HG.gameFn ? HG.gameFn() : GAME) || GAME; } catch (e) { return GAME; } } // taiwan-life 這類共用引擎的遊戲可改寫 HGPlays.gameFn
  function day() { // 以台灣時間（UTC+8）算「哪一天」，方便老師對帳
    var d = new Date(Date.now() + 8 * 3600e3);
    return d.toISOString().slice(0, 10);
  }
  function ls(k, v) {
    try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) {}
    return null;
  }
  function ready() {
    if (readyP) return readyP;
    readyP = (async function () {
      var A = await import(CDN + 'firebase-app.js');
      var Au = await import(CDN + 'firebase-auth.js');
      var F = await import(CDN + 'firebase-firestore.js');
      var app = A.initializeApp(CFG, 'hgplays');
      var auth = Au.getAuth(app);
      if (!auth.currentUser) await Au.signInAnonymously(auth);
      else await auth.authStateReady();
      lib = { F: F, db: F.getFirestore(app), uid: auth.currentUser.uid };
      return lib;
    })().catch(function () { readyP = null; return null; });
    return readyP;
  }
  function getName(n) {
    if (n) return String(n).slice(0, 36);
    try { if (NAME_GETTER) return String(NAME_GETTER() || '').slice(0, 36); } catch (e) {}
    return '';
  }

  var HG = window.HGPlays = {
    /* 每台裝置每天、每個遊戲只算一次訪客 */
    visit: function () {
      var g = gid(), d = day(), key = 'hg.visit.' + g;
      if (ls(key) === d) return;
      ready().then(function (L) {
        if (!L) return;
        var id = d + '_' + g + '_' + L.uid;
        return L.F.setDoc(L.F.doc(L.db, 'visits', id), { game: g, day: d, uid: L.uid, at: L.F.serverTimestamp() })
          .then(function () { ls(key, d); });
      }).catch(function () {});
    },
    /* 真的開始玩一局 */
    start: function (level, name) {
      var mine = cur = { id: null, level: level == null ? '' : String(level).slice(0, 30) };
      ready().then(function (L) {
        if (!L) return;
        var data = { game: gid(), level: mine.level, uid: L.uid, name: getName(name), day: day(),
                     startedAt: L.F.serverTimestamp(), done: false };
        return L.F.addDoc(L.F.collection(L.db, 'plays'), data).then(function (ref) {
          mine.id = ref.id; if (mine.pendingEnd) HG._finish(mine, mine.pendingEnd);
        });
      }).catch(function () {});
    },
    /* 這一局正常結算 */
    end: function (info) {
      var mine = cur; if (!mine || mine.ended) return; mine.ended = true; info = info || {};
      if (mine.id) HG._finish(mine, info); else mine.pendingEnd = info; // 開始的寫入還沒回來就先記著
    },
    _finish: function (mine, info) {
      ready().then(function (L) {
        if (!L || !mine.id) return;
        var u = { done: true, endedAt: L.F.serverTimestamp(),
                  secs: Math.max(0, Math.min(86400, Math.round(Number(info.secs != null ? info.secs : (Date.now() - (mine.t0 || Date.now())) / 1000) || 0))) };
        var s = Number(info.score); if (isFinite(s) && info.score != null) u.score = Math.max(-1e9, Math.min(1e9, Math.round(s)));
        var n = getName(info.name); if (n) u.name = n;
        return L.F.updateDoc(L.F.doc(L.db, 'plays', mine.id), u);
      }).catch(function () {});
    }
  };
  var _s = HG.start; HG.start = function (l, n) { _s(l, n); if (cur) cur.t0 = Date.now(); };
  setTimeout(function () { HG.visit(); }, 2500);   // 等遊戲載完再記訪客
})();
</script>
</body>
